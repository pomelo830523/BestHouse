version: '3.8'

services:
  db:
    image: postgres:16
    container_name: besthouse-db
    environment:
      POSTGRES_DB: besthouse
      POSTGRES_USER: besthouse
      POSTGRES_PASSWORD: besthouse123
    ports:
      - "5432:5432"
    volumes:
      - besthouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besthouse -d besthouse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  besthouse-data:
