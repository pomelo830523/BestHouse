services:
  # 後端：Spring Boot
  - type: web
    name: besthouse-backend
    runtime: java
    rootDir: besthouse-backend
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/besthouse-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        sync: false   # 部署後在 Render 後台填入 Supabase JDBC URL
      - key: DATABASE_USERNAME
        sync: false   # Supabase DB user
      - key: DATABASE_PASSWORD
        sync: false   # Supabase DB password
      - key: ALLOWED_ORIGINS
        sync: false   # 前端 Render URL，例如 https://besthouse-frontend.onrender.com

  # 前端：Angular Static Site
  - type: static
    name: besthouse-frontend
    rootDir: besthouse-frontend
    plan: free
    buildCommand: npm install && npm run build -- --configuration production
    staticPublishPath: dist/besthouse-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
