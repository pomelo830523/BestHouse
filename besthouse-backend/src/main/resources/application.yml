spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/besthouse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei
    username: besthouse
    password: besthouse123
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.besthouse: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
