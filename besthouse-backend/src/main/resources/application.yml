spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/besthouse}
    username: ${DATABASE_USERNAME:besthouse}
    password: ${DATABASE_PASSWORD:besthouse123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

logging:
  level:
    com.besthouse: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: WARN

besthouse:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
